# PiDash server. Start with:  docker compose up -d --build
# Then open http://<server-ip>:8080/ (display) and /admin/ (settings) in any browser.
# Settings: copy .env.example to .env and edit (port, time zone).
services:
  pidash:
    build: .
    image: pidash:local
    container_name: pidash
    restart: unless-stopped
    ports:
      - "${PIDASH_PORT:-8080}:8080"
    volumes:
      # Named volume: Docker gives it the right ownership for the container's non-root user.
      - pidash-data:/data
    environment:
      # Controls what "today" means for calendar events. Use your IANA zone.
      TZ: ${TZ:-America/New_York}

volumes:
  pidash-data:
