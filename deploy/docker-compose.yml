# Standalone PiDash compose - no clone needed. Pulls the prebuilt multi-arch image from GitHub.
#
#   docker compose up -d
# Update later:
#   docker compose pull && docker compose up -d
services:
  pidash:
    image: ghcr.io/torresmi9294/pidash:latest
    # Want Admin > Stream (a live link to add the display to an IPTV player)? Use the image that includes Chromium + ffmpeg:
    # image: ghcr.io/torresmi9294/pidash:stream
    container_name: pidash
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - pidash-data:/data
    environment:
      TZ: America/New_York   # your IANA time zone

volumes:
  pidash-data:
